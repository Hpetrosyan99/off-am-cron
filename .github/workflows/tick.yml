name: Off.am push tick

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Run one poll on the push server
        env:
          TICK_SECRET: ${{ secrets.TICK_SECRET }}
          TICK_URL: https://off-am-push.vercel.app/internal/tick
        run: |
          curl --fail-with-body --silent --show-error --max-time 290 \
            --retry 2 --retry-delay 20 --retry-all-errors \
            -X POST -H "Authorization: Bearer ${TICK_SECRET}" "${TICK_URL}"

  keepalive:
    # GitHub turns off schedules in public repos after 60 days without
    # commits; an empty commit when the last one is 25+ days old keeps it on.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit when the repo is going quiet
        run: |
          age=$(( $(date -u +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -gt $(( 25 * 24 * 3600 )) ]; then
            git config user.name "off-am-cron"
            git config user.email "off-am-cron@users.noreply.github.com"
            git commit --allow-empty -m "keepalive $(date -u +%Y-%m-%d)"
            git push
          fi
